name: Apresentação ALFAWALI - GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar, testar e preparar o site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm run verify
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar apresentação
        id: deployment
        uses: actions/deploy-pages@v5
